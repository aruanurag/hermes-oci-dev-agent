<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="570" viewBox="0 0 1720 570" role="img" aria-labelledby="title desc">
  <title id="title">Private Hermes developer agent on OCI</title>
  <desc id="desc">Mac dashboard access travels through OCI Bastion into a private OCI Compute instance. Hermes uses OCI Generative AI through an instance-principal signing proxy and connects to an allowlisted WhatsApp linked device.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #202124; }
    .title { font-size: 20px; font-weight: 700; } .label { font-size: 17px; font-weight: 600; } .small { font-size: 14px; }
    .box { stroke: #3c4043; stroke-width: 2; rx: 14; } .line { fill: none; stroke: #3c4043; stroke-width: 2.5; marker-end: url(#arrow); }
    .muted { font-size: 13px; fill: #5f6368; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3c4043"/></marker></defs>
  <rect x="620" y="52" width="740" height="480" rx="22" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="648" y="84" class="title" fill="#1971c2">OCI VCN · private subnet</text>
  <rect x="35" y="215" width="205" height="115" class="box" fill="#d3f9d8"/>
  <text x="137" y="258" text-anchor="middle" class="title">Mac</text><text x="137" y="286" text-anchor="middle" class="small">Browser · localhost:9119</text>
  <rect x="325" y="190" width="225" height="160" class="box" fill="#fff3bf"/>
  <text x="437" y="236" text-anchor="middle" class="title">OCI Bastion</text><text x="437" y="266" text-anchor="middle" class="small">time-limited session</text><text x="437" y="290" text-anchor="middle" class="small">SSH port forwarding</text>
  <rect x="670" y="130" width="345" height="345" class="box" fill="#fff"/>
  <text x="842" y="168" text-anchor="middle" class="title">Private OCI Compute</text><text x="842" y="192" text-anchor="middle" class="muted">no public IP</text>
  <rect x="705" y="225" width="275" height="62" class="box" fill="#d3f9d8" stroke="#2b8a3e"/>
  <text x="842" y="252" text-anchor="middle" class="label">Hermes Dashboard</text><text x="842" y="274" text-anchor="middle" class="small">loopback only · 127.0.0.1:9119</text>
  <rect x="705" y="315" width="275" height="62" class="box" fill="#e5dbff" stroke="#7048e8"/>
  <text x="842" y="342" text-anchor="middle" class="label">Hermes Gateway + tools</text><text x="842" y="364" text-anchor="middle" class="small">agent sessions and terminal workspace</text>
  <rect x="705" y="405" width="275" height="43" class="box" fill="#f3f0ff" stroke="#5f3dc4"/>
  <text x="842" y="432" text-anchor="middle" class="label">Persistent Hermes workspace</text>
  <rect x="1065" y="200" width="245" height="98" class="box" fill="#fff4e6" stroke="#e67700"/>
  <text x="1187" y="238" text-anchor="middle" class="label">OCI IAM signing proxy</text><text x="1187" y="264" text-anchor="middle" class="small">instance principal · loopback</text>
  <rect x="1065" y="355" width="245" height="78" class="box" fill="#d3f9d8" stroke="#2b8a3e"/>
  <text x="1187" y="388" text-anchor="middle" class="label">WhatsApp Baileys bridge</text><text x="1187" y="412" text-anchor="middle" class="small">allowlisted private chat</text>
  <rect x="1460" y="190" width="225" height="112" class="box" fill="#d0ebff" stroke="#1971c2"/>
  <text x="1572" y="232" text-anchor="middle" class="title">OCI Generative AI</text><text x="1572" y="260" text-anchor="middle" class="small">openai.gpt-oss-120b</text>
  <rect x="1460" y="365" width="225" height="60" class="box" fill="#d3f9d8" stroke="#2b8a3e"/>
  <text x="1572" y="401" text-anchor="middle" class="label">WhatsApp linked device</text>
  <path d="M240 272 H325" class="line"/><path d="M550 272 H670" class="line"/><path d="M1015 260 H1065" class="line"/><path d="M1310 250 H1460" class="line"/>
  <path d="M980 346 C1020 346 1025 393 1065 393" class="line"/><path d="M1310 394 H1460" class="line"/>
  <text x="260" y="250" class="muted">SSH tunnel</text><text x="554" y="250" class="muted">private SSH</text><text x="1325" y="228" class="muted">signed OCI API call</text><text x="1325" y="375" class="muted">outbound linked-device connection</text>
</svg>
